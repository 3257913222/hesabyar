name: Hesabyar Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip -o Hesabyar_Android_CloudBuild_v1.zip -d project

      - name: Locate Android project
        run: |
          find project -name settings.gradle -o -name settings.gradle.kts
          find project -name build.gradle -o -name build.gradle.kts

      - name: Build APK
        run: |
          ROOT=$(dirname "$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
          if [ -z "$ROOT" ]; then
            echo "Project settings.gradle not found"
            exit 1
          fi
          cd "$ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesabyar-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
